openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Sukoon event management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: events
    description: Sukoon event editions
  - name: requests
    description: Attendance request management
  - name: guests
    description: Confirmed guest management and check-in
  - name: admin
    description: Admin authentication
  - name: user
    description: User authentication and digital passes
  - name: feedbacks
    description: Guest feedbacks

paths:
  /user/signup:
    post:
      operationId: userSignUp
      tags: [user]
      summary: Guest sign up
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserSignUpInput"
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "400":
          description: Validation or duplicate email error

  /user/login:
    post:
      operationId: userLogin
      tags: [user]
      summary: Guest login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserLoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Invalid credentials

  /user/logout:
    post:
      operationId: userLogout
      tags: [user]
      summary: Guest logout
      responses:
        "200":
          description: Logged out

  /user/me:
    get:
      operationId: getUserMe
      tags: [user]
      summary: Get current user session profile
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized

  /user/passes:
    get:
      operationId: getUserPasses
      tags: [user]
      summary: Get digital ticket passes for current logged in user
      responses:
        "200":
          description: List of user passes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserPass"
        "401":
          description: Unauthorized
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /events:
    get:
      operationId: listEvents
      tags: [events]
      summary: List upcoming public events
      responses:
        "200":
          description: List of events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"

  /events/{id}:
    get:
      operationId: getEvent
      tags: [events]
      summary: Get a single event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Event detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "404":
          description: Not found

  /events/{id}/stats:
    get:
      operationId: getEventStats
      tags: [events]
      summary: Get seat stats for an event (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Event seat stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventStats"
        "401":
          description: Unauthorized

  /requests:
    get:
      operationId: listRequests
      tags: [requests]
      summary: List all attendance requests for an event (admin only)
      parameters:
        - name: eventId
          in: query
          required: false
          schema:
            type: integer
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, approved, declined, waitlisted]
      responses:
        "200":
          description: List of requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttendanceRequest"
        "401":
          description: Unauthorized
    post:
      operationId: createRequest
      tags: [requests]
      summary: Submit an attendance request (public)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceRequestInput"
      responses:
        "201":
          description: Request submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRequest"
        "400":
          description: Validation error

  /requests/{id}:
    get:
      operationId: getRequest
      tags: [requests]
      summary: Get a single attendance request (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Request detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRequest"
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /requests/{id}/status:
    patch:
      operationId: updateRequestStatus
      tags: [requests]
      summary: Approve, decline, or waitlist a request (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestStatusUpdate"
      responses:
        "200":
          description: Updated request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRequest"
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /guests:
    get:
      operationId: listGuests
      tags: [guests]
      summary: List confirmed guests for an event (admin / check-in view)
      parameters:
        - name: eventId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of guests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Guest"
        "401":
          description: Unauthorized

  /guests/{id}/checkin:
    patch:
      operationId: checkInGuest
      tags: [guests]
      summary: Mark a guest as arrived (day-of check-in)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Guest checked in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Guest"
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          description: Invalid credentials

  /admin/logout:
    post:
      operationId: adminLogout
      tags: [admin]
      summary: Admin logout
      responses:
        "200":
          description: Logged out

  /admin/me:
    get:
      operationId: getAdminMe
      tags: [admin]
      summary: Get current admin session
      responses:
        "200":
          description: Current admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          description: Unauthorized

  /admin/users:
    get:
      operationId: listUsers
      tags: [admin]
      summary: List all registered accounts
      responses:
        "200":
          description: List of user profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized

  /admin/users/{id}:
    delete:
      operationId: deleteUser
      tags: [admin]
      summary: Delete user account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User deleted
        "401":
          description: Unauthorized

  /admin/events/{id}:
    patch:
      operationId: updateEvent
      tags: [admin]
      summary: Update event pricing and offers (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventUpdateInput"
      responses:
        "200":
          description: Updated successfully
        "400":
          description: Invalid input
        "401":
          description: Unauthorized
        "500":
          description: Internal server error
    delete:
      operationId: deleteEvent
      tags: [admin]
      summary: Delete an event and its associated data
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
        "401":
          description: Unauthorized

  /feedbacks:
    get:
      operationId: listFeedbacks
      tags: [feedbacks]
      summary: List feedbacks
      parameters:
        - name: eventId
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Feedback'
    post:
      operationId: createFeedback
      tags: [feedbacks]
      summary: Submit new feedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feedback'
        '400':
          description: Validation error
  /admin/events:
    post:
      operationId: createEvent
      tags: [admin]
      summary: Create an event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventUpdateInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
  /user/reset-password:
    post:
      operationId: userResetPassword
      tags: [user]
      summary: Reset user password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserResetPasswordInput'
      responses:
        '200':
          description: Success

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Event:
      type: object
      required: [id, title, editionNumber, date, city, venue, capacity, price, status]
      properties:
        id:
          type: integer
        title:
          type: string
        editionNumber:
          type: integer
        date:
          type: string
          format: date-time
        city:
          type: string
        venue:
          type: ["string", "null"]
        capacity:
          type: integer
        price:
          type: number
        originalPrice:
          type: ["number", "null"]
        offerText:
          type: ["string", "null"]
        status:
          type: string
          enum: [upcoming, past, cancelled]
        rsvpLink:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    EventStats:
      type: object
      required: [eventId, capacity, confirmed, pending, waitlisted, declined, arrived]
      properties:
        eventId:
          type: integer
        capacity:
          type: integer
        confirmed:
          type: integer
        pending:
          type: integer
        waitlisted:
          type: integer
        declined:
          type: integer
        arrived:
          type: integer

    EventUpdateInput:
      type: object
      properties:
        price:
          type: number
        originalPrice:
          type: number
        offerText:
          type: string

    AttendanceRequest:
      type: object
      required: [id, eventId, name, phone, email, status, createdAt]
      properties:
        id:
          type: integer
        eventId:
          type: integer
        name:
          type: string
        phone:
          type: string
        email:
          type: string
        socialHandle:
          type: ["string", "null"]
        heardAbout:
          type: ["string", "null"]
        mutualConnection:
          type: ["string", "null"]
        whyAttend:
          type: ["string", "null"]
        department:
          type: ["string", "null"]
        attendancePossibility:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, approved, declined, waitlisted]
        ticketCode:
          type: ["string", "null"]
        checkedIn:
          type: boolean
        createdAt:
          type: string
          format: date-time

    AttendanceRequestInput:
      type: object
      required: [eventId, name, phone, email]
      properties:
        eventId:
          type: integer
        name:
          type: string
          minLength: 2
        phone:
          type: string
          minLength: 10
        email:
          type: string
        socialHandle:
          type: string
        heardAbout:
          type: string
        mutualConnection:
          type: string
        whyAttend:
          type: string
        department:
          type: string
        attendancePossibility:
          type: string

    RequestStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [approved, declined, waitlisted]

    Guest:
      type: object
      required: [id, requestId, eventId, name, phone, email, ticketCode, checkedIn, status]
      properties:
        id:
          type: integer
        requestId:
          type: integer
        eventId:
          type: integer
        name:
          type: string
        phone:
          type: string
        email:
          type: string
        ticketCode:
          type: string
        checkedIn:
          type: boolean
        checkedInAt:
          type: ["string", "null"]
        status:
          type: string
          enum: [confirmed, waitlisted]

    AdminLoginInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    AdminSession:
      type: object
      required: [username, name]
      properties:
        username:
          type: string
        name:
          type: string

    UserSignUpInput:
      type: object
      required: [name, department, phone, email, password]
      properties:
        name:
          type: string
          minLength: 2
        department:
          type: string
        phone:
          type: string
          minLength: 10
        email:
          type: string
        password:
          type: string
          minLength: 4

    UserLoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    UserProfile:
      type: object
      required: [id, name, department, phone, email]
      properties:
        id:
          type: integer
        name:
          type: string
        department:
          type: string
        phone:
          type: string
        email:
          type: string

    UserPass:
      type: object
      required: [id, eventId, eventTitle, eventDate, eventVenue, status, name, department, createdAt]
      properties:
        id:
          type: integer
        eventId:
          type: integer
        eventTitle:
          type: string
        eventDate:
          type: string
        eventVenue:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, approved, declined, waitlisted]
        ticketCode:
          type: ["string", "null"]
        name:
          type: string
        department:
          type: ["string", "null"]
        attendancePossibility:
          type: ["string", "null"]
        checkedIn:
          type: boolean
        createdAt:
          type: string


    Feedback:
      type: object
      required: [id, eventId, name, department, rating, message, createdAt]
      properties:
        id:
          type: integer
        eventId:
          type: integer
        name:
          type: string
        department:
          type: string
        rating:
          type: integer
        message:
          type: string
        createdAt:
          type: string
          format: date-time
    FeedbackInput:
      type: object
      required: [eventId, name, department, rating, message]
      properties:
        eventId:
          type: integer
        name:
          type: string
          minLength: 2
        department:
          type: string
        rating:
          type: integer
          minimum: 1
          maximum: 5
        message:
          type: string
          minLength: 5
    UserResetPasswordInput:
      type: object
      required: [email, phone, newPassword]
      properties:
        email:
          type: string
        phone:
          type: string
        newPassword:
          type: string
